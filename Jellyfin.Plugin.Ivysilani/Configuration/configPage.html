<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <title>iVysílání</title>
</head>
<body>
    <div id="IvysilaniConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox,emby-textarea">
        <div data-role="content">
            <div class="content-primary">
                <form id="IvysilaniConfigForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="ShowUrls">Seznam pořadů (jedna URL na řádek)</label>
                        <textarea is="emby-textarea" id="ShowUrls" name="ShowUrls" rows="12"
                            placeholder="https://www.ceskatelevize.cz/porady/16208367858-na-telo/224512120130001"></textarea>
                        <div class="fieldDescription">
                            Vlož adresu stránky pořadu z ceskatelevize.cz/porady/... (stačí i odkaz na konkrétní díl,
                            plugin si dohledá celý pořad). Jedna adresa na řádek.
                        </div>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="CacheTtlHours">Platnost cache (hodiny)</label>
                        <input id="CacheTtlHours" name="CacheTtlHours" type="number" is="emby-input" min="1" max="24" />
                        <div class="fieldDescription">
                            Jak dlouho se znovu nestahuje seznam dílů a dostupnost streamu z ČT, než se obnoví.
                        </div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Uložit</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var IvysilaniConfig = {
                pluginUniqueId: '50151328-7f55-42fe-b7d2-a789212ef6fc'
            };

            document.querySelector('#IvysilaniConfigPage')
                .addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(IvysilaniConfig.pluginUniqueId).then(function (config) {
                        document.querySelector('#ShowUrls').value = config.ShowUrls || '';
                        document.querySelector('#CacheTtlHours').value = config.CacheTtlHours;
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#IvysilaniConfigForm')
                .addEventListener('submit', function (e) {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(IvysilaniConfig.pluginUniqueId).then(function (config) {
                        config.ShowUrls = document.querySelector('#ShowUrls').value;
                        config.CacheTtlHours = parseInt(document.querySelector('#CacheTtlHours').value, 10) || 3;
                        ApiClient.updatePluginConfiguration(IvysilaniConfig.pluginUniqueId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });

                    e.preventDefault();
                    return false;
                });
        </script>
    </div>
</body>
</html>
