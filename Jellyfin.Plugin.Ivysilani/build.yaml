version: "1.3.1.0"
targetAbi: "12.1.0.0"
framework: "net10.0"
overview: "Celý katalog ČT iVysílání (podle kategorií) + oblíbené pořady, streamované přímo z CDN ČT."
description: >
  Channel plugin, který v Jellyfin knihovně zobrazí celý katalog iVysílání
  (ceskatelevize.cz) podle kategorií (Seriály, Filmy, Dokumenty, ...), plus
  uživatelský seznam oblíbených pořadů ("Oblíbené"), a přehrává je přímo ze
  serverů ČT přes HLS. Žádné stahování médií na server; obsah mizí z
  knihovny, jakmile ho ČT odstraní.
category: "Live TV"
owner: "ivysilani-plugin"
artifacts:
  - "Jellyfin.Plugin.Ivysilani.dll"
changelog: >
  1.3.1: oprava přehrávání na Android TV - MediaSourceInfo.Id už plugin
  nevyplňuje vlastní (MD5-Guid), Jellyfin ho doplní na item.Id, čímž sedí s
  placeholder media source z GET /Items/{id}; TV klient právě tohle Id posílá
  zpět jako MediaSourceId a server na něj dřív odpověděl NoCompatibleStream,
  což jellyfin-androidtv spolkne bez hlášky (černá obrazovka). Mobil
  MediaSourceId neposílá, proto mu to jelo.
  1.3.0: vrstva sezón (složky Season pod seriálem), aby GET /Shows/{id}/Episodes
  nevracel epizody prázdné.
  1.2.0: oprava přehrávání - MediaSourceInfo.Id musí být Guid, jinak Jellyfin
  shazovalo /videos/.../master.m3u8 (FormatException); oprava kategorií
  oříznutých na 80 pořadů (GetChannelItems se volá jen jednou bez stránkování
  a Jellyfin si paging řeší sám nad celým výsledkem, takže kategorie se teď
  stahuje celá, ne po stránkách); oprava seriálů oříznutých na první dávku
  epizod (nahrazeno GraphQL episodesPreviewFind s reálnou paginací); filmy z
  katalogu jsou nyní přímo přehratelné položky (ChannelMediaContentType.Movie),
  ne prázdné složky; rozlišení duplicitních názvů epizod napříč řadami
  (Babylon Berlín apod.).
  1.1.0: kořen channelu nově nabízí celý katalog iVysílání podle kategorií,
  nejen uživatelský seznam URL (ten zůstal jako složka "Oblíbené"); odolnost
  proti 403/429/5xx (retry s backoffem).
  1.0.0: první verze - konfigurovatelný seznam pořadů z iVysílání, streamování
  přímo z CDN ČT, cache stránek/streamů s TTL, automatické mizení položek bez
  dostupného streamu.
