changelog: >
  1.1.0: kořen channelu nově nabízí celý katalog iVysílání podle kategorií
  (lazy, stránkovaně přes GraphQL category.programmeFind), nejen uživatelský
  seznam URL (ten zůstal jako složka "Oblíbené"); odolnost proti 403/429/5xx
  (retry s backoffem, limit 2 souběžné požadavky).
  1.0.0: první verze - konfigurovatelný seznam pořadů z iVysílání, streamování
  přímo z CDN ČT, cache stránek/streamů s TTL, automatické mizení položek bez
  dostupného streamu.
