overview: "Celý katalog ČT iVysílání (podle kategorií) + oblíbené pořady, streamované přímo z CDN ČT."
description: >
  Channel plugin, který v Jellyfin knihovně zobrazí celý katalog iVysílání
  (ceskatelevize.cz) podle kategorií (Seriály, Filmy, Dokumenty, ...), lazy a
  stránkovaně, plus uživatelský seznam oblíbených pořadů ("Oblíbené"), a
  přehrává je přímo ze serverů ČT přes HLS. Žádné stahování médií na server;
  obsah mizí z knihovny, jakmile ho ČT odstraní.
category: "Live TV"
owner: "ivysilani-plugin"
